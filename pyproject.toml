[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ratchet-fea"
version = "0.2.0"
description = "STP-RB-001: fracture mechanics investigation of a PA66 ratchet belt strap"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Tier 2 needs an FE stack; Tier 1 is pure numpy/scipy.
tier2 = [
    "scikit-fem>=8.0",
    "meshio>=5.3",
    "pygmsh>=7.1",
    "gmsh>=4.11",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
